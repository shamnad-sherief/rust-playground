syntax = "proto3";

package calculator;

// The Calculator service definition
service Calculator{
 // Unary RPC; Takes two integers and returns their sum.
 rpc Add (AddRequest)
 returns (AddResponse);

 // Unary RPC; Takes two floats and returns their division
 rpc Divide (DivideRequest)
 returns (DivideResponse);
}


message AddRequest{
 int64 a = 1;
 int64 b = 2;

}

message AddResponse{
    int64 result = 1;
}

message DivideRequest{
 double numerator = 1;
 double denominator = 2;
}

message DivideResponse{
 double result = 1;
}