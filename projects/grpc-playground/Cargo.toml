[package]
name = "grpc-playground"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "calculator-server"
path = "src/server.rs"

[[bin]]
name = "calculator-client"
path = "src/client.rs"

[dependencies]
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[build-dependencies]
tonic-prost-build = "0.14"
protoc-bin-vendored = "3.2.0"
